<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rosy:#e0417c;--rosy-dark:#c22e64;--zest:#f8e140;--zest-dark:#c9b418;--blossom:#eac7df;--teal:#2f8aa3;--teal-dark:#1f6376;--cream:#fff8f2;
--fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,-apple-system,sans-serif;
--pad:44px;--gap:20px;--n3:3;--n2:2;--n4:4;--nf:3;--h1:58px;--h2:40px;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--teal-dark);font-family:var(--fb);font-weight:700;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;margin:0;line-height:1.1}
h3{font-size:20px}h4{font-size:16px}p{margin:0}ul,ol{margin:0;padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{display:block;flex:none}a{color:inherit}
:focus-visible{outline:3px solid var(--teal-dark);outline-offset:3px}
.bg-rosy :focus-visible,.bg-teal :focus-visible,.bg-tdark :focus-visible,.side :focus-visible,.lb :focus-visible{outline-color:var(--zest)}
.fine{font-size:14px;font-weight:600;opacity:.85}.ctr{text-align:center}.ctr-t{text-align:center}
.bg-rosy{background:var(--rosy);color:var(--cream)}.bg-zest{background:var(--zest);color:var(--teal-dark)}.bg-teal{background:var(--teal);color:var(--cream)}.bg-blossom{background:var(--blossom);color:var(--teal-dark)}.bg-tdark{background:var(--teal-dark);color:var(--cream)}.bg-cream{background:var(--cream)}
.c-rosy{background:var(--rosy);color:var(--cream);--sh:var(--rosy-dark)}.c-zest{background:var(--zest);color:var(--teal-dark);--sh:var(--zest-dark)}.c-teal{background:var(--teal);color:var(--cream);--sh:var(--teal-dark)}.c-blossom{background:var(--blossom);color:var(--teal-dark);--sh:var(--rosy)}.c-cream{background:var(--cream);color:var(--teal-dark);--sh:var(--blossom)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--zest);padding:8px 14px;border-radius:99px}

/* buttons */
.btn{--bg:var(--rosy);--sh:var(--rosy-dark);--fg:var(--cream);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--fd);font-weight:600;font-size:19px;line-height:1;padding:15px 28px;border:0;border-radius:999px;background:var(--bg);color:var(--fg);box-shadow:0 7px 0 var(--sh);margin-bottom:7px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .09s ease,box-shadow .09s ease}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sh)}
.btn.zest{--bg:var(--zest);--sh:var(--zest-dark);--fg:var(--teal-dark)}.btn.teal{--bg:var(--teal);--sh:var(--teal-dark)}.btn.cream{--bg:var(--cream);--sh:var(--blossom);--fg:var(--teal-dark)}
.btn.ghost{--bg:transparent;--fg:currentColor;box-shadow:none;border:3px solid currentColor;padding:12px 25px;margin-bottom:7px}.btn.ghost:active{transform:translateY(2px)}
.btn.sm{font-size:16px;padding:10px 18px;box-shadow:0 4px 0 var(--sh);margin-bottom:4px}.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}.btn.sm.ghost{padding:7px 15px;box-shadow:none}
.btn.icon{padding:0;width:54px;height:54px}.btn[disabled]{opacity:.5;pointer-events:none}.btn.fw{width:100%}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.ibtn{background:none;border:0;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:inherit;flex:none}.ibtn:hover{background:var(--blossom)}.ibtn[disabled]{opacity:.35;pointer-events:none}
.ibtn.dark{background:var(--blossom);color:var(--teal-dark)}
.iconbtn{width:44px;height:44px;padding:0}.btn.sm.iconbtn{padding:0;border-width:3px}

/* inputs */
.in{width:100%;font:inherit;font-weight:700;font-size:17px;color:var(--teal-dark);background:var(--cream);border:3px solid var(--teal);border-radius:20px;padding:12px 18px;box-shadow:0 4px 0 var(--blossom);outline:none}
.in:focus{border-color:var(--rosy);box-shadow:0 4px 0 var(--rosy-dark)}.in.big{font-size:20px;padding:15px 20px}.in.code{font-family:var(--fd);font-weight:600;letter-spacing:.06em;font-size:24px}
.in.bad{border-color:var(--rosy-dark);box-shadow:0 4px 0 var(--rosy-dark)}.in.sel{width:auto;padding:9px 16px;font-size:15px}.in.num{padding:8px 12px;font-size:17px;text-align:right}
.fl{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:800}.fl>.in,.fl>.inwrap{font-weight:700}
.inwrap{position:relative}.inwrap .in{padding-right:56px}.inwrap .ic-in{padding-left:52px;padding-right:20px}.inwrap>.ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--teal);pointer-events:none}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;color:var(--teal-dark)}.eye:hover{background:var(--blossom)}
.ferr{display:flex;gap:8px;align-items:flex-start;font-weight:800;font-size:15px;background:var(--cream);color:var(--rosy-dark);border-radius:16px;padding:10px 14px;border:3px solid var(--rosy-dark)}.ferr.sm{font-size:13px;padding:6px 10px;margin-top:6px}
.two-in{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:inline-flex;background:var(--blossom);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-weight:800;font-size:15px;color:var(--teal-dark);display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--cream);box-shadow:0 3px 0 var(--teal-dark)}
.wrapseg{display:flex;margin-top:10px}.wrapseg button{flex:1 1 40%;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cream);color:var(--teal-dark);border:3px solid var(--blossom);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.chip:hover,.chip[aria-pressed="true"]{border-color:var(--rosy);background:var(--blossom)}.chips{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:54px;height:32px;border-radius:99px;border:0;background:var(--blossom);padding:3px;box-shadow:inset 0 0 0 3px var(--teal);flex:none}.sw i{display:block;width:26px;height:26px;border-radius:50%;background:var(--teal);transition:transform .15s}
.sw.on{background:var(--teal);box-shadow:0 3px 0 var(--teal-dark)}.sw.on i{transform:translateX(22px);background:var(--cream)}
.cbox{width:32px;height:32px;border-radius:11px;border:3px solid var(--teal);background:var(--cream);display:grid;place-items:center;color:var(--cream);flex:none;padding:0}
.cbox[aria-checked="true"],.cbox.on{background:var(--teal);box-shadow:0 3px 0 var(--teal-dark)}.cbox:not(.on):not([aria-checked="true"]) svg{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;background:var(--zest);color:var(--teal-dark);white-space:nowrap}
.tag.rosy{background:var(--rosy);color:var(--cream)}.tag.teal,.st-g,.l-otw{background:var(--teal);color:var(--cream)}.tag.blossom{background:var(--blossom)}.tag.cream{background:var(--cream)}
.st-m,.l-almost{background:var(--zest);color:var(--teal-dark)}.st-x{background:var(--blossom);color:var(--rosy-dark)}.l-home{background:var(--cream);color:var(--teal-dark);box-shadow:inset 0 0 0 2px var(--teal-dark)}.l-there{background:var(--rosy);color:var(--cream)}
.tag.zest{background:var(--zest)}
.av{border-radius:50%;display:inline-grid;place-items:center;font-family:var(--fd);font-weight:600;border:3px solid var(--cream);flex:none;position:relative}
.av.on::after{content:'';position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:2px solid var(--cream)}
.stack{display:inline-flex}.stack .av{margin-left:-10px}.stack .av:first-child{margin-left:0}
.badge{font-style:normal;background:var(--zest);color:var(--teal-dark);border-radius:99px;font-size:12px;font-weight:800;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.ico{width:52px;height:52px;border-radius:44% 56% 52% 48%/52% 44% 56% 48%;background:var(--cream);color:var(--rosy);display:grid;place-items:center;flex:none}.ico.sm{width:38px;height:38px}.ico.xl{width:96px;height:96px}
.card{background:var(--cream);color:var(--teal-dark);border:3px solid var(--cream);border-radius:26px;padding:20px;box-shadow:0 6px 0 var(--sh,var(--blossom))}
.card.c-blossom{border-color:var(--cream)}.card p{font-size:15px;font-weight:600}
.blobcard{border-radius:46% 54% 38% 62%/50% 42% 58% 50%}.card.blobcard{border-radius:46% 54% 38% 62%/50% 42% 58% 50%;padding:26px 28px}
.lift{transition:transform .18s ease}@media (hover:hover){.lift:hover{transform:translateY(-4px) rotate(-1deg)}}
.tbl{width:100%;border-collapse:collapse;font-size:15px;background:var(--cream);color:var(--teal-dark);border-radius:22px;overflow:hidden}.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:3px solid var(--blossom)}.tbl thead th{background:var(--teal-dark);color:var(--cream);font-family:var(--fd)}.tbl tbody th{font-weight:800}

/* motion */
.spark{position:fixed;z-index:9999;pointer-events:none;margin:-8px 0 0 -8px;animation:pop .7s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.1) rotate(40deg);opacity:0}}
@keyframes pulse{50%{opacity:.5}}@keyframes ping{from{transform:scale(1);opacity:.8}to{transform:scale(1.8);opacity:0}}@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}
.sk{background:var(--blossom);border-radius:18px;animation:pulse 1.4s ease-in-out infinite}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--teal-dark);color:var(--cream);padding:12px 20px;border-radius:999px;font-weight:800;font-size:15px;box-shadow:0 5px 0 var(--teal);display:flex;gap:8px;align-items:center;z-index:60;animation:tin .22s ease-out;max-width:90%;width:max-content}
.toast.err{background:var(--rosy-dark);box-shadow:0 5px 0 var(--rosy)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== doc page ===== */

.dnav{position:sticky;top:0;z-index:50;background:var(--rosy);color:var(--cream);padding-top:env(safe-area-inset-top,0px)}.dnav .wrap{display:flex;align-items:center;gap:22px;height:68px}
.dnav nav{display:flex;gap:20px;margin:0 auto}.dnav nav a{text-decoration:none;font-weight:800}.dnav nav a:hover{text-decoration:underline;text-underline-offset:5px}
.logo{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:700;font-size:28px;letter-spacing:-.02em}.logo b{font-weight:700}.logo .ic{color:var(--zest)}.logo.cr .ic{color:var(--zest)}
.hero-d .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.hero-d h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.025em;margin:18px 0}
.hero-d .lead{max-width:38ch;font-size:21px}.hero-d .ctas{display:flex;gap:16px;flex-wrap:wrap;margin:26px 0 12px}.hero-d .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.h2d{font-size:clamp(32px,4.4vw,52px);letter-spacing:-.02em}.intro{font-size:19px;max-width:60ch;margin:12px 0 28px;font-weight:700}
.ctl{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;background:var(--cream);border-radius:26px;padding:18px 22px;margin-bottom:18px}.cg{display:flex;flex-direction:column;gap:6px}.cl{font-size:13px;font-weight:800}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;margin-bottom:26px}.jlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jbtn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--cream);border:3px solid var(--cream);border-radius:18px;padding:8px 12px;font-weight:800;font-size:14px;line-height:1.2}.jbtn b{background:var(--blossom);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none;font-family:var(--fd)}
.jbtn.on{border-color:var(--rosy);background:var(--blossom)}.jbtn:hover{border-color:var(--teal)}
.jsteps{background:var(--cream);border-radius:22px;padding:16px 18px}.jd{display:flex;flex-direction:column;margin-bottom:10px}.jd span{font-size:14px;font-weight:600}.jchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.jc{display:inline-flex;gap:6px;align-items:center;border:3px solid var(--blossom);background:var(--cream);border-radius:99px;padding:5px 12px;font-weight:800;font-size:14px}.jc i{font-style:normal;background:var(--blossom);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px}
.jc.now{background:var(--rosy);border-color:var(--rosy);color:var(--cream)}.jc.now i{background:var(--cream);color:var(--rosy)}.jc.past{background:var(--teal);border-color:var(--teal);color:var(--cream)}
.stagewrap{position:relative;overflow:hidden;width:100%}.scaler{position:absolute;left:0;top:0;transform-origin:top left;width:max-content}
.pstage{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.notes{background:var(--cream);border-radius:26px;padding:22px 26px;margin-top:26px}.notes h3{margin-bottom:10px}.notes dl{display:grid;grid-template-columns:170px 1fr;gap:8px 18px;margin:0 0 12px}.notes dt{font-weight:800;font-family:var(--fd)}.notes dd{margin:0;font-weight:600}
.smgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}.smcol h3{margin-bottom:4px}.smcol ul{margin-top:12px;display:grid;gap:8px}.node{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:var(--cream);border:3px solid var(--teal);border-radius:99px;padding:7px 14px;font-weight:800;font-size:15px}.node .ic:last-child{margin-left:auto}.node:hover{border-color:var(--rosy)}
.access{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}.access .card h3{margin:12px 0 6px}
.tblrow{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}.tblrow h3{margin-bottom:10px;font-size:24px}
.spfilt{display:flex;gap:8px;margin:18px 0 22px}.spec{background:var(--cream);border-radius:24px;margin-bottom:12px;border:3px solid var(--cream)}.spec[open]{border-color:var(--rosy)}
.spec summary{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;list-style:none;font-size:18px}.spec summary::-webkit-details-marker{display:none}.spec summary b{font-family:var(--fd);font-weight:600;font-size:21px;margin-right:auto}.spec[open] summary .sc{transform:rotate(180deg)}
.sn2{width:32px;height:32px;border-radius:50%;background:var(--zest);display:grid;place-items:center;font-family:var(--fd);font-size:15px;flex:none}
.spb{padding:0 22px 22px}.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;margin:0}.sgrid dt{font-family:var(--fd);font-weight:600;color:var(--rosy-dark);font-size:15px;margin-bottom:2px}.sgrid dd{margin:0;font-weight:600;font-size:15px}.pp{margin-bottom:14px}
.dspart{background:var(--cream);color:var(--teal-dark);border-radius:30px;padding:26px 28px;margin-bottom:22px}.dsh{font-size:28px;margin-bottom:16px}.dsg{display:grid;gap:18px}.dsg.two{grid-template-columns:1fr 1fr}.dsg.g3x{grid-template-columns:repeat(3,minmax(0,1fr))}.dsg.sw{grid-template-columns:repeat(4,1fr)}
.dsb{background:var(--cream);border:3px solid var(--blossom);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}.dsb h4{font-size:15px}.dsb.dk-b{background:var(--teal-dark)}.dsb.bgr{background:var(--rosy);color:var(--cream)}.cr{color:var(--cream)}
.dsrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.dsrow.bgz{background:var(--blossom);border-radius:22px;padding:18px 20px}.dsrow.mk{margin-top:14px}
.swc{display:flex;flex-direction:column;gap:2px}.swc i{font-style:normal;border-radius:22px;padding:34px 12px 12px;font-family:var(--fd);font-size:15px;box-shadow:inset 0 0 0 3px var(--blossom)}.swc span{font-size:13px;font-weight:600}
.tdisp{font-family:var(--fd);font-weight:600;font-size:38px;line-height:1.05;margin:10px 0}.tdisp.s2{font-size:28px}.tdisp.s3{font-size:20px}.tb1{font-size:18px;font-weight:700;margin:10px 0}.tb2{font-size:15px;font-weight:600}
.mini-sheet{background:var(--cream);border:3px solid var(--teal);border-radius:26px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;width:100%}.mini-sheet .row{gap:8px}

/* ===== device frames ===== */
.device{--h1:58px;--h2:40px;--pad:44px;--n3:3;--n2:2;--n4:4;--nf:3;--gap:20px;position:relative;flex:none;background:var(--teal-dark);color:var(--teal-dark);width:1120px;border-radius:26px;padding:0 0 8px}
.device[data-device=tablet]{--h1:46px;--h2:32px;--pad:30px;--n3:2;--n4:2;--nf:2;width:790px;border-radius:40px;padding:16px}
.device[data-device=mobile]{--h1:36px;--h2:28px;--pad:18px;--n3:1;--n2:1;--n4:2;--nf:2;--gap:14px;width:396px;border-radius:52px;padding:14px}
.chrome{height:46px;display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--cream)}.dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--rosy)}.dots i:nth-child(2){background:var(--zest)}.dots i:nth-child(3){background:var(--teal)}
.urlbar{flex:1;max-width:560px;margin:0 auto;background:var(--teal);border-radius:99px;padding:6px 16px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}

function toast(msg,kind=''){
  const host=$('#toast');if(!host)return;
  const t=document.createElement('div');t.className='toast '+kind;t.innerHTML=(kind==='err'?ic('alert',18):ic('check',18))+`<span>${msg}</span>`;
  host.innerHTML='';host.appendChild(t);clearTimeout(toast._t);toast._t=setTimeout(()=>{host.innerHTML=''},2600);
}
function burst(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['var(--zest)','var(--rosy)','var(--cream)','var(--teal)','var(--zest)','var(--rosy)','var(--cream)'];
  for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';const a=Math.random()*Math.PI*2,d=44+Math.random()*52;
    s.style.cssText=`left:${x}px;top:${y}px;--tx:${(Math.cos(a)*d).toFixed(0)}px;--ty:${(Math.sin(a)*d).toFixed(0)}px;color:${cols[i]}`;
    s.innerHTML=ic('sparkle',16);document.body.appendChild(s);setTimeout(()=>s.remove(),760);}
}
function burstMid(){const v=$('.viewport');if(!v)return;const r=v.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.4)}

  if(st==='empty'&&EMPTY[k])return empty(EMPTY[k]);

  return (st==='offline'?offline():'')+fn();
}

/* ================= EXPENSES ================= */
function calcDebts(){
  const total=spent(),share=total/SHARERS.length,net={};
  SHARERS.forEach(n=>net[n]=-share);S.exp.forEach(e=>{net[e.w]=(net[e.w]||0)+e.a});
  const cr=Object.entries(net).filter(([,v])=>v>.5).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
  const db=Object.entries(net).filter(([,v])=>v<-.5).map(([n,v])=>({n,v:-v})).sort((a,b)=>b.v-a.v);
  const out=[];let ci=0;
  db.forEach(d=>{let rem=d.v;while(rem>.5&&ci<cr.length){const c=cr[ci],x=Math.min(rem,c.v);out.push({f:d.n,t:c.n,a:Math.round(x)});rem-=x;c.v-=x;if(c.v<.5)ci++}});
  return {out,share};
}
const debtKey=d=>d.f+'>'+d.t;
views.expenses=()=>gate('expenses',()=>{
  const {out,share}=calcDebts(),unpaid=out.filter(d=>!S.paid[debtKey(d)]);
  const paidBy=S.exp.filter(e=>e.w==='Merylle').reduce((a,e)=>a+e.a,0);
  const owed=unpaid.filter(d=>d.t==='Merylle').reduce((a,d)=>a+d.a,0)-unpaid.filter(d=>d.f==='Merylle').reduce((a,d)=>a+d.a,0);
  const rem=owed>0?peso(owed):owed<0?peso(-owed):peso(0);
  const row=d=>{const done=S.paid[debtKey(d)];return `<li class="drow ${done?'paid':''}">${av(d.f,30)}<span class="dt">${d.f==='Merylle'?'You owe':`${d.f} owes`} <b>${d.t==='Merylle'?'you':d.t}</b></span><b class="da">${peso(d.a)}</b>${done?tag('Paid','st-g','check'):`<button class="btn sm teal" data-act="paid" data-k="${debtKey(d)}">Mark paid</button>`}</li>`};
  const mine=out.filter(d=>d.t==='Merylle'||d.f==='Merylle'),others=out.filter(d=>!(d.t==='Merylle'||d.f==='Merylle'));
  const settled=out.length&&!unpaid.length;
  return `${head('Okay, sino nag-abono?','Track what was actually spent and who still owes whom.',tag('Ambagan','zest','wallet'))}<div class="tiles t4"><div class="tile c-cream"><b>${peso(spent())}</b><span>Total spent</span></div><div class="tile c-blossom"><b>${peso(share)}</b><span>Your share</span></div><div class="tile c-zest"><b>${peso(paidBy)}</b><span>You've paid</span></div><div class="tile c-teal"><b>${rem}</b><span>Remaining · ${owed>0?"you're owed":owed<0?'you owe':'all clear'}</span></div></div>
  <div class="two-col exp"><div class="card"><div class="rh"><h3>Expenses</h3><button class="btn sm rosy hide-m" data-act="sheet" data-v="addExp">${ic('plus',18)} Add expense</button></div><ul class="elist">${S.exp.map(e=>`<li class="erow">${av(e.w,34)}<div class="eb"><b>${esc(e.n)}</b><span>${tag(esc(e.c),'blossom')} Paid by ${esc(e.w)} · ${esc(e.d)} · split ${SHARERS.length} ways</span></div><b class="ea">${peso(e.a)}</b></li>`).join('')}</ul></div>
  <div class="card owes"><div class="rh"><h3>Who owes whom</h3></div>${settled?`<div class="settled"><span class="ico xl cel" style="${blob(4)}">${ic('burst',40)}</span><h3>All settled. Walang may habol.</h3></div>`:''}<h4 class="sh">With you</h4><ul class="dl">${mine.map(row).join('')||'<li class="fine">Nothing between you and anyone.</li>'}</ul>${others.length?`<h4 class="sh">Everyone else</h4><ul class="dl">${others.map(row).join('')}</ul>`:''}</div></div>`;
});

  ['Inputs & controls',`<div class="dsg g3x"><label class="fl">Text<input class="in" placeholder="Baguio Before Graduation"></label><label class="fl">Gala code<input class="in code" value="OTW-7K2P"></label><label class="fl">Error<input class="in bad" value="OTW-9999"><span class="ferr sm">${ic('alert',16)}Hmm, hindi namin makita 'yan. Check the code and try again.</span></label><label class="fl">Select<select class="in"><option>Food</option><option>Transportation</option></select></label><div class="fl">Password<div class="inwrap"><input class="in" type="password" value="baguio2026" id="dspw"><button class="ibtn eye" onclick="const i=$('#dspw');i.type=i.type==='password'?'text':'password'" aria-label="Show or hide password">${ic('eye',22)}</button></div></div><div class="fl">Switch and checkbox<div class="row"><button class="sw on" role="switch" aria-checked="true" onclick="this.classList.toggle('on')"><i></i></button><button class="cbox" role="checkbox" aria-checked="true" onclick="this.classList.toggle('on')">${ic('check',18)}</button></div></div><div class="fl">Segmented tabs<div class="seg"><button aria-pressed="true">Upcoming</button><button aria-pressed="false">Month</button><button aria-pressed="false">Week</button></div></div><div class="fl">Chips<div class="chips"><button class="chip">${ic('sparkle',12)} Use example</button><button class="chip">${ic('pin',14)} Baguio City</button></div></div></div>`],
  ['Cards',`<div class="dsg g3x"><div class="card"><h3>Base card</h3><p class="fine">Cream, 26px radius, 3px cream border.</p></div><div class="card blobcard" style="${blob(0)}"><h3>Blob card</h3><p class="fine">Asymmetric radius for a hand-cut feel.</p></div><button class="fcard c-zest lift"><span class="ico" style="${blob(2)}">${ic('route',26)}</span><h3>Feature card</h3><p>Lifts and tilts on hover (desktop only)</p></button><div class="card c-teal"><h3>Teal card</h3><p class="fine">Cream text on teal.</p></div><div class="card c-rosy"><h3>Rosy card</h3><p class="fine">Reserved for headline numbers.</p></div><article class="gcard card"><span class="gdate">14<i>Nov</i></span><div class="gcb"><h3>Baguio Before Graduation</h3><p>${ic('pin',14)}Baguio City ${ic('users',14)}10 people</p></div></article></div>`],
  ['Navigation',`<div class="dsg two"><div class="dsb dk-b"><h4 class="cr">Sidebar item (desktop)</h4><div class="dsside"><button class="sn on">${ic('home',22)}<span class="lbl">Home</span></button><button class="sn">${ic('users',22)}<span class="lbl">Who's G?</span></button><button class="sn">${ic('chat',22)}<span class="lbl">Chismis</span><em class="badge">2</em></button></div></div><div class="dsb"><h4>Mobile bottom nav: exactly three, no labels</h4><div class="dsbn"><button class="bn on" aria-label="Home">${ic('home',26)}</button><button class="bn" aria-label="Chat">${ic('chat',26)}<em class="badge">2</em></button><button class="bn" aria-label="Map">${ic('map',26)}</button></div><p class="fine">Active = solid teal with a teal-dark shadow. Inside a gala the three are Home, Chat, Map. In the account area they are Home, Notifications, Profile.</p></div><div class="dsb"><h4>Plan tabs (mobile and tablet)</h4><div class="ptabs static">${["Who's G?",'The plan','Gastos','Ambagan','Checklist'].map((l,i)=>`<button class="${i===1?'on':''}">${l}</button>`).join('')}</div></div><div class="dsb"><h4>Floating action</h4><button class="fab s" aria-label="Add">${ic('plus',28)}</button></div></div>`],
  ['Badges & statuses',`<div class="dsrow">${['g','m','x'].map(stBadge).join('')}${Object.values(LOC).map(l=>tag(l.l,l.cls)).join('')}${tag('Gala Leader','zest','crown')}${tag('Member','blossom','user')}${tag('Sharing on','l-there','nav')}<em class="badge s">2</em></div><p class="fine">Every status pairs an icon with text. Color never carries meaning alone.</p>`],
  ['Avatars & map markers',`<div class="dsrow">${av('Merylle',48,true)}${av('CJ',48)}${av('Josh',48)}${av('Alex',48)}${stack(['Merylle','CJ','Josh','Alex','Sam','Bea','Jamie'],40,4)}</div><div class="dsrow mk">${[['home','Alex'],['otw','CJ'],['almost','Sam'],['there','Bea']].map(([s,n])=>`<svg class="map mk1" viewBox="-34 -34 68 68" role="img" aria-label="${LOC[s].l} marker"><g class="pin ${LOC[s].cls}">${s==='otw'||s==='almost'?'<circle class="pulse" r="18"/>':''}<circle class="ring" r="24"/><circle class="pf pf-${byName(n).c}" r="18"/><text class="pt pt-${byName(n).c}" y="6" text-anchor="middle">${n[0]}</text></g></svg>`).join('')}<svg class="map mk1" viewBox="-34 -34 68 68" role="img" aria-label="Destination marker"><circle r="20" class="m-flag"/><path d="M-5 9V-9M-5-8h11l-2.4 4.5L6 1H-5" class="m-flag-i"/></svg></div><p class="fine">Ring style encodes status: dashed = still at home, teal = on the way, zest = almost there, rosy = already there. Pulse only on moving pins.</p>`],
  ['Overlays & feedback',`<div class="dsg g3x"><div class="dsb"><h4>Modal (desktop) / bottom sheet (mobile)</h4><div class="mini-sheet"><div class="grab"></div><b>Add a Stop</b><span class="fine">Same content, two containers.</span><div class="row"><button class="btn sm ghost">Cancel</button><button class="btn sm rosy">Add a Stop</button></div></div></div><div class="dsb"><h4>Confirm dialog</h4><div class="mini-sheet"><b>Delete this photo?</b><span class="fine">Removed for everyone.</span><div class="row"><button class="btn sm ghost">Cancel</button><button class="btn sm rosy">Delete photo</button></div></div></div><div class="dsb"><h4>Dropdown and tooltip</h4><div class="ddw"><button class="btn sm teal" data-dd aria-expanded="false">Assign to ${ic('chevd',16)}</button><ul class="ddm" hidden><li>Nobody yet</li><li>Merylle</li><li>CJ</li></ul></div><button class="ibtn tipb" aria-label="Copy" data-tip="Copy gala code">${ic('copy',22)}</button></div><div class="dsb"><h4>Toasts</h4><div class="row wrapr"><button class="btn sm teal" data-dtoast="Gala code copied.">Success</button><button class="btn sm rosy" data-dtoast="Couldn't save. Nothing changed." data-kind="err">Error</button></div></div><div class="dsb"><h4>Sparkle burst</h4><button class="btn sm zest" onclick="burstEl(this)">Confirm something</button><p class="fine">5 to 7 sparkles, about 700ms, only on confirming actions.</p></div></div>`],
  ['Progress & countdown',`<div class="dsg g3x"><div class="dsb"><h4>Bar</h4><div class="bar"><i style="width:43%"></i></div></div><div class="dsb"><h4>Ring</h4><svg width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="70 percent"><circle cx="36" cy="36" r="28" class="rg-b"/><circle cx="36" cy="36" r="28" class="rg-f" stroke-dasharray="123 176" transform="rotate(-90 36 36)"/><text x="36" y="42" text-anchor="middle" class="rg-t">70%</text></svg></div><div class="dsb"><h4>Upload row</h4><ul class="uplist"><li class="uprow ok">${ic('image',20)}<span class="un">IMG_2041.jpg</span><div class="ubar"><i style="width:100%"></i></div><span class="us">Done</span></li><li class="uprow fail">${ic('image',20)}<span class="un">IMG_2042.jpg</span><div class="ubar"><i style="width:62%"></i></div><span class="us">Failed <button class="lnk">Retry</button></span></li></ul></div><div class="dsb bgr"><h4 class="cr">Countdown</h4>${cdown()}</div><div class="dsb" style="grid-column:span 2"><h4>Journey route</h4><div>${routeStrip()}</div></div></div>`],
  ['Chat & photos',`<div class="dsg two"><div class="dsb chatdemo"><div class="msys">${ic('sparkle',12)}<span>Alex joined the gala.</span></div><div class="msg">${av('CJ',32,true)}<div class="mb"><span class="mn">CJ<i>8:15 PM</i></span><p>G ako. Sino pa free ng Nov 14?</p><button class="react on">${ic('heart',14)}2</button></div></div><div class="mnew"><span>2 new</span></div><div class="msg me"><div class="mb"><span class="mn">You<i>9:03 PM</i></span><p>Check the Gastos tab.</p></div></div><div class="mcard"><span class="ico sm">${ic('route',20)}</span><div><b>Jamie added a new itinerary stop</b><span>Session Road lunch</span></div></div></div><div class="dsb"><div class="masonry m2">${PH.slice(0,4).map(p=>`<div class="phw" style="height:${p.h-60}px"><div class="ph c-${p.c}">${ic('image',28,'ph-i')}<span class="ph-cap"><b>${p.t}</b><i>${p.w}</i></span></div></div>`).join('')}</div></div></div>`],
  ['Calendar cells',`<div class="cal"><div class="cal-g dsc"><div class="dc"><b>3</b></div><div class="dc today"><b>29</b></div><div class="dc has"><b>14</b><span class="ev e-upcoming">Baguio</span></div><div class="dc has"><b>29</b><span class="ev e-ongoing">Food Crawl</span></div><div class="dc has"><b>2</b><span class="ev e-done">Pagsanjan</span></div></div></div><p class="fine">Default, today, upcoming, ongoing, completed.</p>`],
  ['State templates',`<div class="dsg g3x">${empty({i:'pin',t:'No stops yet. Saan tayo?',b:'Add the places, activities, food stops, and everything in between.',c:'Add a Stop',noop:1})}${errBlock({t:"The route didn't load.",b:'Your stops are safe. Try again.'})}<div class="dsb"><h4>Loading</h4>${skeleton('x').replace('g3','g2')}</div><div class="dsb">${offline()}</div><div class="dsb"><div class="lbar deny">${ic('alert',24)}<div><b>Location is blocked for OTW.</b><span>Turn it on in site settings, or set your status by hand.</span></div></div></div><div class="dsb"><div class="lbar deny">${ic('alert',24)}<div><b>2 photos didn't upload.</b><span>Check your connection and try again.</span></div></div></div></div>`],
  ['Icon set',`<div class="icons">${ico.map(k=>`<span title="${k}">${ic(k,26)}</span>`).join('')}</div><p class="fine">Inline SVG, 24px viewBox, 2px rounded stroke, currentColor. No emoji anywhere.</p>`]];
  return parts.map(([t,b])=>`<section class="dspart"><h3 class="dsh">${t}</h3>${b}</section>`).join('');
}
/* ================= APP BOOT ================= */
views.system=()=>`<section class="sec bg-rosy"><button class="btn sm cream" data-go="landing">${ic('back',18)} Back to OTW</button><h1 class="h1" style="margin-top:22px">Design system</h1><p class="lead">One kit, eight brand colors, two typefaces. Same components on every screen size.</p></section><section class="sec bg-blossom">${dsHtml()}</section>`;
const devOf=()=>innerWidth<640?'mobile':innerWidth<1024?'tablet':'desktop';
let firstSync=true;
function syncChrome(){
  const dev=$('#dev');if(!dev)return;
  dev.dataset.device=S.device;document.title=SC[S.screen].t+' · OTW';
  const h='#/'+S.screen;
  if(location.hash!==h){history[firstSync?'replaceState':'pushState'](null,'',h)}
  firstSync=false;
  $$('[data-ctl]').forEach(b=>b.setAttribute('aria-pressed',String(S[b.dataset.ctl])===b.dataset.v));
}
const SEGS={state:[['default','Default'],['loading','Loading'],['empty','Empty'],['error','Error'],['offline','Offline'],['success','Success']],phase:[['planning','Planning'],['day','Gala day'],['done','Done']],role:[['leader','Leader'],['member','Member']],acct:[['false','No account'],['true','Account']]};
const CL={state:'Screen state',phase:'Gala phase',role:'Viewing as',acct:'Account'};
$('#demoPanel').innerHTML='<p class="fine">Preview tools. Not part of the product.</p>'+Object.keys(SEGS).map(k=>`<div class="cg"><span class="cl">${CL[k]}</span><div class="seg" role="group" aria-label="${CL[k]}">${SEGS[k].map(o=>`<button data-ctl="${k}" data-v="${o[0]}" aria-pressed="false">${o[1]}</button>`).join('')}</div></div>`).join('');
function pageToast(msg,kind){const h=$('#ptoast');h.innerHTML=`<div class="toast ${kind||''}">${ic(kind==='err'?'alert':'check',18)}<span>${msg}</span></div>`;clearTimeout(pageToast._t);pageToast._t=setTimeout(()=>h.innerHTML='',2400)}
document.addEventListener('click',e=>{
  const db=e.target.closest('#demoBtn');if(db){const p=$('#demoPanel');p.hidden=!p.hidden;db.setAttribute('aria-expanded',!p.hidden);return}
  const c=e.target.closest('[data-ctl]');
  if(c){const k=c.dataset.ctl,v=c.dataset.v;if(k==='state'){setState(v);return}S[k]=k==='acct'?v==='true':v;render();return}
  const dt=e.target.closest('[data-dtoast]');if(dt){pageToast(dt.dataset.dtoast,dt.dataset.kind);return}
  const dd=e.target.closest('[data-dd]');if(dd){const m=dd.nextElementSibling;const o=m.hidden;m.hidden=!o;dd.setAttribute('aria-expanded',o)}
});
addEventListener('resize',()=>{const d=devOf();if(d!==S.device){S.device=d;render()}});
addEventListener('hashchange',()=>{const k=location.hash.replace('#/','');if(SC[k]&&k!==S.screen)go(k)});
(function boot(){
  S.device=devOf();$('#dev').dataset.device=S.device;
  const k=location.hash.replace('#/','');
  if(SC[k]){S.screen=k;if(SC[k].g==='Account')S.acct=true;if(k==='plan')S.plan=blankPlan()}
  render(true);
})();
</script></body></html>
