# ==============================================================================
# OTW Server Configuration
# ==============================================================================
# All sensitive data is injected via environment variables (.env file).
# NO passwords, secrets, or API keys are stored in this file.
# ==============================================================================

# Server
server.port=${SERVER_PORT:8080}
# Behind Railway/Vercel proxies: Tomcat's RemoteIpValve takes the client IP from
# X-Forwarded-For only when the request comes from a trusted (private-range) proxy,
# so getRemoteAddr() is the real client and the header can't be spoofed directly.
server.forward-headers-strategy=native
# Small app: 50 request threads is plenty and keeps memory down (Tomcat default is 200).
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:50}
spring.application.name=otw-server

# ------------------------------------------------------------------------------
# Supabase PostgreSQL Database (Datasource & HikariCP)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=otw-hikari-pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ------------------------------------------------------------------------------
# Flyway Database Migrations
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# Redis (Disposable cache layer)
# ------------------------------------------------------------------------------
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms

# ------------------------------------------------------------------------------
# Supabase Auth / OAuth2 Resource Server JWT Validation
# ------------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://placeholder.supabase.co/auth/v1}

# ------------------------------------------------------------------------------
# Supabase API & Realtime Broadcast Credentials
# ------------------------------------------------------------------------------
supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
supabase.jwt-audience=${SUPABASE_JWT_AUD:authenticated}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# ------------------------------------------------------------------------------
# Google Drive (Gala Dump: one folder per gala, one-time upload links, file
# checks on registration — see the photo package and docs/GOOGLE_DRIVE_SETUP.md).
# Left blank, uploads and photo registration fail closed (reject).
# ------------------------------------------------------------------------------
google.drive.credentials-json-base64=${GOOGLE_DRIVE_CREDENTIALS_JSON_BASE64:}
google.drive.photos-folder-id=${GOOGLE_DRIVE_PHOTOS_FOLDER_ID:}
google.drive.application-name=${GOOGLE_DRIVE_APPLICATION_NAME:OTW}
# Upload as the owner's Google account (normal Gmail Drive): an OAuth client + a refresh token
# issued once with the "https://www.googleapis.com/auth/drive" scope. When set, these win over the
# service account above, so nobody else has to sign in to Google to add photos.
google.drive.oauth-client-id=${GOOGLE_DRIVE_OAUTH_CLIENT_ID:}
google.drive.oauth-client-secret=${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:}
google.drive.refresh-token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
# Orphan sweep (DriveOrphanSweeper): trashes files in gala folders that have no photo row and are
# older than min-age. Cron "-" turns it off.
google.drive.orphan-sweep.cron=${GOOGLE_DRIVE_ORPHAN_SWEEP_CRON:0 30 */6 * * *}
google.drive.orphan-sweep.min-age=${GOOGLE_DRIVE_ORPHAN_SWEEP_MIN_AGE:PT24H}

# ------------------------------------------------------------------------------
# Gala dates are local calendar dates; this zone decides "today" for gala phase,
# My Galas buckets, reminders and the location-sharing cutoff.
# ------------------------------------------------------------------------------
otw.timezone=${OTW_TIMEZONE:Asia/Manila}

# ------------------------------------------------------------------------------
# CORS Configuration
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ------------------------------------------------------------------------------
# API docs (Swagger UI + /v3/api-docs): off unless API_DOCS_ENABLED=true.
# Keep it off in production so the full API map isn't public.
# ------------------------------------------------------------------------------
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# ------------------------------------------------------------------------------
# Logging (compact console output; request lines come from RequestLoggingFilter)
# ------------------------------------------------------------------------------
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%-8logger{0}){cyan} %msg%n
# DEBUG locally; set OTW_LOG_LEVEL=INFO in production (less output, less CPU).
logging.level.com.gala.otw_server=${OTW_LOG_LEVEL:DEBUG}

# ------------------------------------------------------------------------------
# Actuator Monitoring
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false
management.health.redis.enabled=false
