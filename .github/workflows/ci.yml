name: OTW Backend CI

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x ./mvnw
        working-directory: ./otw-server

      - name: Compile and Test with Maven
        run: ./mvnw test -B
        working-directory: ./otw-server

      - name: Verify Docker build
        run: docker build -t otw-server:ci ./otw-server

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./otw-client

    # Placeholders only: NEXT_PUBLIC_* values are baked in at build time, and the real ones live on Vercel.
    env:
      NEXT_PUBLIC_BACKEND_URL: https://backend.example.com
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: otw-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
