services:
  postgres:
    image: postgres:16-alpine
    container_name: otw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otw-net

  redis:
    image: redis:7-alpine
    container_name: otw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otw-net

  otw-server:
    build:
      context: ./otw-server
      dockerfile: Dockerfile
    container_name: otw-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_JWT_AUD: ${SUPABASE_JWT_AUD:-authenticated}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-https://placeholder.supabase.co/auth/v1}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - otw-net

networks:
  otw-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
